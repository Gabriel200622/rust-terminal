# Use with: neptune --config config.example.toml
# Omitted fields use the application's defaults. Unknown keys are rejected.

# graphite, dusk, or light
theme = "graphite"

# Highlight for focus, selection and the cursor:
# blue, indigo, purple, pink, red, orange, yellow, green, or graphite
accent = "blue"

# Saved scale of terminal text and window chrome: 0.2–5.0 (20%–500%).
# Adjust Window zoom in Preferences or with Ctrl+Plus/Minus (Command on macOS).
# Ctrl+0 resets zoom to 100% (Command on macOS). Zoom is restored on launch.
window_zoom = 1.0

# Saved terminal text size: 9–32; adjust in Preferences or with Ctrl+Shift+Plus/Minus.
# Ctrl+Shift+0 resets terminal text size to the default (14).
# App zoom uses Ctrl+Plus/Minus (Command on macOS) without changing this value.
# Line-height multiplier: 1.0–2.0.
font_size = 14.0
line_height = 1.4

# Maximum retained history lines per terminal: 0–1,000,000.
# A 16-million-cell budget also bounds history and both screen buffers.
# Wide grids with large history limits can exceed this budget.
scrollback = 10000

# Omit shell to use the platform default. This is an executable, not a shell
# command with arguments. Examples: /bin/zsh, /bin/bash, pwsh.exe.
# shell = "/bin/zsh"

# block, beam, or underline
cursor = "block"
cursor_blink = false

# Sidebar width: 170–360 logical pixels.
sidebar_width = 216.0

# Restore workspace organization; every terminal starts a new process.
restore_workspaces = true
confirm_close = true

# Native desktop banners for OSC notifications. Pane rings and history stay enabled.
desktop_notifications = true
